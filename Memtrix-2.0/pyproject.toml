[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memtrix-game"
version = "2.0.0"
description = "Offline memory game with five modes, profiles, daily challenges and inspectable Python rules"
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5,<3"]
authors = [{name = "MONIKA AKTER"}]

[project.scripts]
memtrix = "memtrix.app:main"

[tool.setuptools.packages.find]
include = ["memtrix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
